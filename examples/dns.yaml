# DNS over UDP or TCP, RFC 1035.
#
# Decodes a whole message: the header, the question section, and the answer,
# authority, and additional sections. An owner name may be a compression
# pointer (RFC 1035 §4.1.4) — two bytes meaning "the name at offset N" — which
# the `pointer:` type follows.
#
# Record data stays opaque bytes. That is a choice rather than a limitation:
# what is inside RDATA depends on the record type, and a switch over the
# type registry would be most of this file for none of the point.
name: dns
version: "1.0"
entry: message
input: either
doc: DNS messages, header, question section, and resource records.

enums:
  opcode: {0: query, 1: iquery, 2: status, 4: notify, 5: update}
  rcode: {0: noerror, 1: formerr, 2: servfail, 3: nxdomain, 4: notimp, 5: refused}
  rrtype: {1: a, 2: ns, 5: cname, 6: soa, 12: ptr, 15: mx, 16: txt, 28: aaaa, 255: any}
  rrclass: {1: internet, 3: chaos, 4: hesiod, 255: any}

units:
  message:
    doc: One DNS message.
    fields:
      - name: id
        type: {int: {bits: 16}}
        doc: Copied into the reply; matches responses to requests.
      - name: flags
        type: {unit: flags}
      - name: qdcount
        type: {int: {bits: 16}}
        doc: Number of entries in the question section.
      - name: ancount
        type: {int: {bits: 16}}
      - name: nscount
        type: {int: {bits: 16}}
      - name: arcount
        type: {int: {bits: 16}}
      - name: questions
        type: {unit: question}
        repeat: {count: "qdcount"}
      - name: answers
        type: {unit: rr}
        repeat: {count: "ancount"}
      - name: authority
        type: {unit: rr}
        repeat: {count: "nscount"}
      - name: additional
        type: {unit: rr}
        repeat: {count: "arcount"}

  flags:
    doc: The 16-bit flags word, MSB first.
    fields:
      - {name: qr, type: {int: {bits: 1}}, doc: "0 query, 1 response."}
      - {name: opcode, type: {int: {bits: 4, enum: opcode}}}
      - {name: aa, type: {int: {bits: 1}}, doc: "Authoritative answer."}
      - {name: tc, type: {int: {bits: 1}}, doc: "Truncated."}
      - {name: rd, type: {int: {bits: 1}}, doc: "Recursion desired."}
      - {name: ra, type: {int: {bits: 1}}, doc: "Recursion available."}
      - {name: null, type: {int: {bits: 3}}, doc: "Reserved, must be zero."}
      - {name: rcode, type: {int: {bits: 4, enum: rcode}}}

  question:
    fields:
      - {name: qname, type: {unit: name}}
      - {name: qtype, type: {int: {bits: 16, enum: rrtype}}}
      - {name: qclass, type: {int: {bits: 16, enum: rrclass}}}

  rr:
    doc: One resource record, in the answer, authority, or additional section.
    fields:
      - {name: name, type: {unit: name}, doc: "The owner name, often a pointer."}
      - {name: type, type: {int: {bits: 16, enum: rrtype}}}
      - {name: class, type: {int: {bits: 16, enum: rrclass}}}
      - {name: ttl, type: {int: {bits: 32}}}
      - {name: rdlength, type: {int: {bits: 16}}}
      - name: rdata
        type: {bytes: {size: {expr: "rdlength"}}}
        doc: Opaque here; what is inside depends on the record type.

  name:
    doc: >
      A sequence of labels, ending either in a zero-length label or in a
      compression pointer, which is always the last thing in a name.
    fields:
      - name: labels
        type: {unit: label}
        repeat: {until: "labels.length == 0 or labels.length >= 192"}

  label:
    doc: >
      A length byte, then the rest of the label. The top two bits of the
      length decide which: 00 means that many bytes of text, and 11 means the
      byte is the high half of a compression pointer. 01 and 10 are reserved,
      and there is no default, so a message using one is undecodable rather
      than guessed at.
    fields:
      - {name: length, type: {int: {bits: 8}}}
      - name: rest
        type:
          switch:
            on: "length >> 6"
            cases:
              0: {string: {size: {expr: "length"}}}
              3: {unit: {name: compressed, args: ["length"]}}

  compressed:
    doc: >
      The second half of a compression pointer: the offset is the low 14 bits
      of the two bytes, counted from the start of the message.
    params: [{name: high, type: int}]
    fields:
      - {name: low, type: {int: {bits: 8}}}
      - name: target
        type: {pointer: {at: "((high & 63) << 8) | low", type: {unit: name}}}
        doc: The name already at that offset, read there and returned from.
