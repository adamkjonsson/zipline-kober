[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kober"
# The single source of truth for the version; `kober.__version__`
# reads it back out of the installed metadata.
version = "0.6.0.dev0"
description = "Decode network protocols from a declarative specification into Zipline decode stages"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Adam Jonsson", email = "akj426@gmail.com" }]
classifiers = [
    # The design is built, but the format underneath is 0.x and explicitly not
    # production-ready. Do not promise more than DESIGN.md does.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
# Pinned to one `zpf` minor on purpose: while that library is in 0.x every
# minor is a break with no upgrade path promised, so a range spanning two of
# them would be a promise neither project can keep.
#
# 0.6.0 implements Zipline Payload Format v0.23, whose `net:` content-type
# scheme is what a decoded packet is labelled (`net:ip`), and what a
# sessionization stage such as zpfwire's recognises a packet by. A 0.5.x build
# cannot read a file written at 0.23 at all, and 0.6.0 refuses one written at
# 0.21, so the floor is that minor's first release. The earlier floors' reasons
# still hold, and every one is in 0.6.0: `reason_class=` on
# `DecodeStage.undecoded` (0.5.2, python-zipline#79), for a transform's
# `fails_as`; `params_digest=` on `decode_stage` (0.5.1, #77); `adjacency=`
# (0.5.0), for field-granularity output's unit sequence; and `role=` and a
# `ts` derived from `cites` (0.3.0).
dependencies = ["zpf>=0.6.0,<0.7"]

[project.optional-dependencies]
# YAML is the authoring format for specs, and comments are the reason: a
# protocol spec wants an RFC citation next to each field, which JSON cannot
# carry. It stays optional so the core keeps the stdlib-only rule — the spec
# model is what the decoder consumes, and `Spec.from_dict` / `Spec.from_json`
# reach it without any third-party parser.
yaml = ["PyYAML>=6.0"]

[project.scripts]
kober = "kober.cli:main"

[project.urls]
Specification = "https://github.com/adamkjonsson/zipline/blob/v0.23/docs/zipline-payload-format.md"
Changelog = "https://github.com/adamkjonsson/zipline-kober/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/kober"]

[tool.pytest.ini_options]
testpaths = ["tests"]
