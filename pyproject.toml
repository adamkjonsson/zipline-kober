[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kober"
# The single source of truth for the version; `kober.__version__`
# reads it back out of the installed metadata.
version = "0.7.0.dev0"
description = "Decode network protocols from a declarative specification into Zipline decode stages"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Adam Jonsson", email = "akj426@gmail.com" }]
classifiers = [
    # The design is built, but the format underneath is 0.x and explicitly not
    # production-ready. Do not promise more than DESIGN.md does.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
# python-zipline, imported as `zpf`, by its release tag and never by name
# (#64). It is not on PyPI, and neither name is safe there: `zpf` belongs to an
# unrelated project, and `python-zipline` is unclaimed, so a declaration by
# name and range would be resolved against PyPI and install whoever claims it.
# A direct reference is never looked up on an index. What it costs is a range:
# a python-zipline patch reaches kober through a kober release, and kober and
# zpfwire must name the same tag to share an environment. zpfwire declares it
# the same way, for the same reason (python-zipline-wire#67). A range again
# once python-zipline is published under its own name.
#
# One minor at a time, as before: while python-zipline is in 0.x every minor is
# a separate format, so the tag is the minor's. 0.8.0 implements Zipline
# Payload Format v0.24, which zpfwire 0.9.0 writes, and which settles what a
# closed TCP stream's extent is (zipline#168): before it, a decode stage over
# one failed its own coverage check by the FIN's position. It also adds the
# `copy` flag, which kober reads to skip a capture-point copy of a datagram. The
# earlier floors' reasons all hold in it: `net:` labels (0.23), `reason_class=`
# (0.5.2), `params_digest=` (0.5.1), `adjacency=` (0.5.0), and `role=` and a
# `ts` derived from `cites` (0.3.0).
#
# `.venv` installs this; a sibling checkout of an unreleased python-zipline
# goes in `.venv-dev`, never here (docs/dev/contributing.md, #61).
dependencies = [
    "python-zipline @ git+https://github.com/adamkjonsson/python-zipline.git@v0.8.0",
]

[project.optional-dependencies]
# YAML is the authoring format for specs, and comments are the reason: a
# protocol spec wants an RFC citation next to each field, which JSON cannot
# carry. It stays optional so the core keeps the stdlib-only rule — the spec
# model is what the decoder consumes, and `Spec.from_dict` / `Spec.from_json`
# reach it without any third-party parser.
yaml = ["PyYAML>=6.0"]

[project.scripts]
kober = "kober.cli:main"

[project.urls]
Specification = "https://github.com/adamkjonsson/zipline/blob/v0.24/docs/zipline-payload-format.md"
Changelog = "https://github.com/adamkjonsson/zipline-kober/blob/main/CHANGELOG.md"

# The dependency above is a direct reference, on purpose (see its comment);
# hatchling refuses one unless told this.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/kober"]

[tool.pytest.ini_options]
testpaths = ["tests"]
