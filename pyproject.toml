[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kober"
# The single source of truth for the version; `kober.__version__`
# reads it back out of the installed metadata.
version = "0.3.0.dev0"
description = "Decode network protocols from a declarative specification into Zipline decode stages"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Adam Jonsson", email = "akj426@gmail.com" }]
classifiers = [
    # The design is built, but the format underneath is 0.x and explicitly not
    # production-ready. Do not promise more than DESIGN.md does.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
# Pinned to one `zpf` minor on purpose: while that library is in 0.x every
# minor is a break with no upgrade path promised, so a range spanning two of
# them would be a promise neither project can keep.
#
# The floor is 0.3.0, which implements Zipline Payload Format v0.19. Two things
# this project is built on landed *in* it: `role=` on `DecodeStage.record()`,
# which is where a field path belongs now that the format has somewhere to put
# one, and a `ts` derived from `cites`, which is the specification's own
# timestamp rule rather than the run-wide approximation that preceded it. A
# build predating either satisfies no useful floor.
dependencies = ["zpf>=0.3.0,<0.4"]

[project.optional-dependencies]
# YAML is the authoring format for specs, and comments are the reason: a
# protocol spec wants an RFC citation next to each field, which JSON cannot
# carry. It stays optional so the core keeps the stdlib-only rule — the spec
# model is what the decoder consumes, and `Spec.from_dict` / `Spec.from_json`
# reach it without any third-party parser.
yaml = ["PyYAML>=6.0"]

[project.scripts]
kober = "kober.cli:main"

[project.urls]
Specification = "https://github.com/adamkjonsson/zipline/blob/v0.19/docs/zipline-payload-format.md"
Changelog = "https://github.com/adamkjonsson/zipline-kober/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/kober"]

[tool.pytest.ini_options]
testpaths = ["tests"]
